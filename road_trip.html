<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Road Trip Planner — EV Australia Hub</title>
<style>
  :root{
    --sand:#EFE9DA; --sand-dim:#E4DCC7; --ink:#20291F; --ink-soft:#4B5A47;
    --gum:#2F5D45; --gum-dark:#234636; --amber:#E0A93B; --amber-dark:#B9862A;
    --line:#D8CFB6; --card:#FBFAF5; --radius:18px; --header-h:56px;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{ background:var(--sand); color:var(--ink); font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif; min-height:100vh; }
  h1,h2,h3{ font-family:Georgia,"Times New Roman",serif; font-weight:700; letter-spacing:-0.01em; margin:0; }
  a{color:inherit;}

  .topbar{ position:sticky; top:0; z-index:20; height:var(--header-h); background:var(--sand);
    border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; padding:0 14px; }
  .topbar .home-btn{ display:flex; align-items:center; gap:6px; text-decoration:none; background:none; border:none;
    font-size:14px; font-weight:600; color:var(--gum-dark); cursor:pointer; padding:8px 4px; }
  .topbar .home-btn .dot{ width:8px;height:8px;border-radius:50%;background:var(--amber); }
  .topbar .crumb{ font-size:13px; color:var(--ink-soft); flex:1; text-align:right; }

  .app{ max-width:460px; margin:0 auto; padding:20px 14px 60px; }

  /* Responsive: widen and breathe more on tablet/desktop, don't stay phone-narrow */
  @media (min-width: 640px){
    .app{ max-width:620px; padding:28px 24px 70px; }
    .home-title{ font-size:27px; }
    .card, .summary-card{ padding:30px 28px; }
    #tripMap svg{ max-height:340px; }
  }
  @media (min-width: 1024px){
    .topbar{ position:fixed; top:0; left:0; right:0; }
    .app{ max-width:760px; padding:100px 24px 80px; }
    .home-title{ font-size:30px; }
    .q-title{ font-size:17px; }
    .options{ flex-direction:row; }
    .options .opt{ flex:1; }
  }

  .home-title{ font-size:23px; line-height:1.3; margin-bottom:4px; }
  .home-sub{ font-size:14px; color:var(--ink-soft); margin-bottom:20px; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:24px 20px; }
  .q-title{ font-size:15.5px; font-weight:700; margin-bottom:8px; }
  .q-help{ font-size:13px; color:var(--ink-soft); margin-bottom:10px; line-height:1.5; }
  .field-block{ margin-bottom:22px; }
  .field-block:last-of-type{ margin-bottom:0; }

  input[type=text], input[type=number]{
    width:100%; padding:12px 14px; font-size:15px; border:1.5px solid var(--line);
    border-radius:10px; background:#fff; color:var(--ink);
  }
  input[type=text]:focus, input[type=number]:focus{ outline:none; border-color:var(--gum); }

  .options{ display:flex; flex-wrap:wrap; gap:8px; }
  .opt{ flex:1 1 auto; min-width:100px; text-align:center; background:#fff; border:1.5px solid var(--line);
    border-radius:10px; padding:11px 10px; font-size:13.5px; color:var(--ink); cursor:pointer; }
  .opt.selected{ border-color:var(--gum); background:#EAF2ED; font-weight:700; }

  .shortlist-pills{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .pill{ background:#fff; border:1.5px solid var(--line); border-radius:20px; padding:8px 14px; font-size:13px; cursor:pointer; }
  .pill.selected{ border-color:var(--gum); background:#EAF2ED; font-weight:700; }

  .btn{ border:none; border-radius:10px; padding:13px 22px; font-size:15px; font-weight:600; cursor:pointer; width:100%; }
  .btn-primary{ background:var(--gum); color:#fff; }
  .btn-primary:hover{ background:var(--gum-dark); }
  .btn-primary:disabled{ background:#B9C2B4; cursor:not-allowed; }
  .restart{ display:block; width:100%; text-align:center; margin-top:10px; background:transparent;
    border:1.5px solid var(--line); border-radius:12px; padding:12px; font-size:14px; color:var(--ink-soft); cursor:pointer; }

  .error-box{ background:#FBEAEA; border:1.5px solid #D98C8C; border-radius:12px; padding:12px 14px; font-size:13.5px; color:#7A2E2E; margin-bottom:16px; }

  /* results */
  .summary-card{ background:var(--card); border:1.5px solid var(--amber); border-radius:var(--radius); padding:20px; margin-bottom:18px; }
  .summary-title{ font-size:19px; font-family:Georgia,serif; font-weight:700; margin-bottom:12px; }
  .summary-grid{ display:flex; flex-wrap:wrap; gap:14px; }
  .summary-stat{ font-size:13px; min-width:90px; }
  .summary-stat b{ display:block; font-size:17px; }

  .day-label{ font-size:13px; font-weight:700; color:var(--gum-dark); margin:20px 0 8px; text-transform:uppercase; letter-spacing:.03em; }
  .day-label:first-of-type{ margin-top:0; }
  .leg-card{ background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:16px; margin-bottom:10px; }
  .leg-route{ font-size:15px; font-weight:700; margin-bottom:4px; }
  .leg-dist{ font-size:12.5px; color:var(--ink-soft); margin-bottom:10px; }
  .leg-soc{ display:flex; gap:16px; font-size:13px; margin-bottom:8px; }
  .leg-soc b{ display:block; font-size:15px; }
  .leg-charge-note{ font-size:13px; background:#EAF2ED; border-radius:8px; padding:8px 10px; color:var(--gum-dark); }
  .leg-overnight-note{ font-size:13px; background:#F1E3C6; border-radius:8px; padding:8px 10px; color:var(--amber-dark); }

  .footnote{ font-size:12px; color:var(--ink-soft); text-align:center; margin-top:18px; line-height:1.6; }

  /* new: gear icon, toggles, inline edit forms, warnings */
  .gear-btn{ background:none; border:none; font-size:18px; cursor:pointer; padding:6px; color:var(--ink-soft); }
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; margin:10px 0; }
  .toggle-row .toggle-label{ font-size:13.5px; }
  .switch{ position:relative; width:42px; height:24px; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{ position:absolute; cursor:pointer; inset:0; background:var(--line); border-radius:24px; transition:.15s; }
  .slider:before{ content:""; position:absolute; height:18px; width:18px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.15s; }
  .switch input:checked + .slider{ background:var(--gum); }
  .switch input:checked + .slider:before{ transform:translateX(18px); }

  .warning-banner{ background:#FBEAEA; border:1.5px solid #D98C8C; border-radius:10px; padding:8px 10px; font-size:12.5px; color:#7A2E2E; margin-bottom:8px; }
  .add-stop-row{ display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 16px; }
  .add-stop-row button{ flex:1 1 auto; font-size:12px; padding:8px 10px; border-radius:8px; border:1.2px dashed var(--line); background:transparent; color:var(--gum-dark); cursor:pointer; }
  .inline-form{ background:#fff; border:1.5px solid var(--gum); border-radius:12px; padding:14px; margin:8px 0 16px; }
  .inline-form label{ display:block; font-size:12.5px; color:var(--ink-soft); margin:8px 0 4px; }
  .inline-form input, .inline-form select{ width:100%; padding:9px 10px; font-size:14px; border:1.5px solid var(--line); border-radius:8px; }
  .inline-form .form-actions{ display:flex; gap:8px; margin-top:12px; }
  .inline-form .form-actions button{ flex:1; padding:10px; border-radius:8px; border:none; font-size:13.5px; font-weight:600; cursor:pointer; }
  .inline-form .cancel-btn{ background:var(--sand-dim); color:var(--ink-soft); }
  .inline-form .save-btn{ background:var(--gum); color:#fff; }
  .remove-link{ background:none; border:none; color:#B04A4A; font-size:12px; cursor:pointer; padding:0; margin-top:8px; }
  .small-number{ width:70px !important; display:inline-block; }
  .date-badge{ font-size:12px; color:var(--ink-soft); font-weight:600; }
  .settings-field{ margin-bottom:16px; }
  .settings-field label{ display:block; font-size:13.5px; font-weight:600; margin-bottom:6px; }
  .settings-field .hint{ font-size:12px; color:var(--ink-soft); margin-top:4px; }

  #tripMap{ height:300px; border-radius:14px; border:1.5px solid var(--line); margin-bottom:18px; background:var(--card); overflow:hidden; }
  #tripMap.schematic{ padding:12px; box-sizing:border-box; }
  .live-badge{ display:inline-block; font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:20px; margin-left:6px; }
  .live-badge.live{ background:#DDEFE2; color:var(--gum-dark); }
  .live-badge.estimated{ background:var(--sand-dim); color:var(--ink-soft); }
  .gmaps-link{ font-size:12.5px; color:var(--gum-dark); text-decoration:none; font-weight:600; display:inline-block; margin-top:8px; }
</style>
</head>

/* ---------- Real distance math, ported from data/australianData.tsx ---------- */
function haversineDistance(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
const CIRCUITY_FACTOR = 1.28; // same road-vs-crow-flies factor used across the full app
function calculateDrivingDistance(a,b,factor){ return Math.round(haversineDistance(a.lat,a.lng,b.lat,b.lng)*(factor||CIRCUITY_FACTOR)); }

/* ---------- LIVE charger lookup — OpenChargeMap's public API, called
   directly from the browser. No API key, no backend needed: this is the
   exact same endpoint the full app's server proxies, but OCM's API is
   open for client-side GET requests, so a standalone file can call it
   directly. Falls back to an estimated stop if this fails (offline, or
   OCM has nothing nearby) — same fallback behaviour as the full app. */
function mapOcmResult(p, anchor){
  const addr = p.AddressInfo || {};
  const conns = p.Connections || [];
  // Prefer higher-power connections and more bays — same principle as the
  // full app's Rule 4 (hardware preference) and Rule 16 (multi-bay
  // redundancy), but using OpenChargeMap's real NumberOfPoints field rather
  // than any fabricated reliability score.
  const bestConn = conns.slice().sort((a,b)=>(b.PowerKW||0)-(a.PowerKW||0))[0] || {};
  return {
    name: addr.Title || "Public EV Charger",
    operator: (p.OperatorInfo && p.OperatorInfo.Title) || "Unknown network",
    connectionType: (bestConn.ConnectionType && bestConn.ConnectionType.Title) || "DC Fast Charger",
    powerKw: bestConn.PowerKW || null,
    bays: p.NumberOfPoints || conns.length || null,
    usageCost: p.UsageCost || null,
    lastUpdated: p.DateLastStatusUpdate || null,
    lat: addr.Latitude, lng: addr.Longitude,
    distanceFromAnchor: anchor ? Math.round(haversineDistance(anchor.lat, anchor.lng, addr.Latitude, addr.Longitude)) : null,
    isLive: true
  };
}

async function ocmSearch(lat, lng, radiusKm, maxresults){
  const url = `https://api.openchargemap.io/v3/poi/?output=json&latitude=${lat}&longitude=${lng}&distance=${radiusKm}&distanceunit=KM&countrycode=AU&maxresults=${maxresults}&compact=true&verbose=false`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("OCM request failed: " + res.status);
  const pois = await res.json();
  return Array.isArray(pois) ? pois.filter(p => p.AddressInfo && p.AddressInfo.Latitude && p.Connections && p.Connections.length>0) : [];
}

/* Used by the automatic route planner. Widens the search progressively
   (35km, then 60km, then 120km) rather than giving up quickly — a real
   charger a bit further away is always better than an invented stop at a
   town that has none, per how the original app's corridor rules worked. */
async function findNearbyCharger(lat, lng){
  const radii = [35, 60, 120];
  for (const r of radii){
    try{
      const pois = await ocmSearch(lat, lng, r, 6);
      if (!pois.length) continue;
      const ranked = pois.map(p=>mapOcmResult(p, {lat,lng}))
        .sort((a,b)=> (b.powerKw||0)+(b.bays||1)*10 - ((a.powerKw||0)+(a.bays||1)*10));
      return ranked[0];
    }catch(e){ return null; } // network/offline — caller falls back to an honest placeholder
  }
  return null; // genuinely nothing found within 120km — be honest about that rather than inventing a stop
}

/* For manual "add a stop" — let the person pick a real charger themselves
   instead of guessing a distance. Returns up to 8 nearby results, or an
   { error } if the search couldn't run at all. */
async function searchChargersNear(townName, radiusKm){
  const anchor = findLocation(townName);
  if (!anchor) return { error: `Couldn't find "${townName}" in the location list.` };
  try{
    const pois = await ocmSearch(anchor.lat, anchor.lng, radiusKm||35, 10);
    if (!pois.length) return { results: [] };
    const results = pois.map(p=>mapOcmResult(p, anchor)).sort((a,b)=> a.distanceFromAnchor - b.distanceFromAnchor);
    return { results };
  }catch(e){ return { error: "Couldn't reach OpenChargeMap — check your internet connection." }; }
}

function gmapsLegUrl(fromLoc, toLoc){
  return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(fromLoc.name+', Australia')}&destination=${encodeURIComponent(toLoc.name+', Australia')}&travelmode=driving`;
}
function gmapsFullTripUrl(itinerary){
  const pts = itinerary.filter(l=>l.kind!=='stay' && l.kind!=='sidetrip');
  if (!pts.length) return "https://maps.google.com";
  const origin = pts[0].from.name, destination = pts[pts.length-1].to.name;
  const rawWaypoints = pts.slice(0,-1).map(l=>l.to.name).filter(n=>n && n!==destination);
  const waypoints = rawWaypoints.filter((n,i,arr)=> n!==arr[i-1]); // drop consecutive duplicates (e.g. overnight-in-place)
  let url = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin+', Australia')}&destination=${encodeURIComponent(destination+', Australia')}&travelmode=driving`;
  if (waypoints.length) url += `&waypoints=${encodeURIComponent(waypoints.map(w=>w+', Australia').join('|'))}`;
  return url;
}

function findLocation(name){
  if (!name) return null;
  const keys = Object.keys(NATIONAL_LOCATIONS);
  const exact = keys.find(k=>k.toLowerCase()===name.trim().toLowerCase());
  if (exact) return {name:exact, ...NATIONAL_LOCATIONS[exact]};
  const partial = keys.find(k=>k.toLowerCase().includes(name.trim().toLowerCase()));
  if (partial) return {name:partial, ...NATIONAL_LOCATIONS[partial]};
  return null;
}

function parseCSVLine(line){
  const result = []; let cur = ""; let inQ = false;
  for (let i=0;i<line.length;i++){
    const c = line[i];
    if (c === '"'){ inQ = !inQ; }
    else if (c === ',' && !inQ){ result.push(cur.trim()); cur=""; }
    else { cur += c; }
  }
  result.push(cur.trim());
  return result;
}

function mapBodyType(brand, model, bodyStyle){
  const s = bodyStyle.toLowerCase(); const m = model.toLowerCase();
  if (s.includes("hatch")) return "Hatchback";
  if (s.includes("sedan")) return "Sedan";
  if (s.includes("van")) return "Van";
  if (s.includes("ute") || s.includes("truck") || s.includes("pickup")) return "Ute / Truck";
  if (s.includes("performance") || s.includes("sport") || m.includes("taycan") || m.includes("e-tron gt")) return "Performance";
  if (m.includes("atto 2")||m.includes("zs")||m.includes("ev3")||m.includes("kona")||m.includes("b10")||m.includes("zeekr x")||m.includes("ex30")||m.includes("ix1")||m.includes("eqa")) return "Compact SUV";
  if (m.includes("atto 3")||m.includes("sealion")||m.includes("model y")||m.includes("s6")||m.includes("ex5")||m.includes("aion v")||m.includes("ev5")||m.includes("ioniq 5")||m.includes("c10")||m.includes("g6")||m.includes("zeekr 7x")||m.includes("polestar 4")||m.includes("q4")||m.includes("macan")) return "Medium SUV";
  if (m.includes("009")||m.includes("ev6")||m.includes("ex90")||m.includes("ix")||m.includes("eqe")) return "Large SUV";
  return "Medium SUV";
}

function getNumericTowingCapacity(capacity){
  if (!capacity) return 0;
  const match = capacity.replace(/,/g,"").match(/(\d+)\s*kg/i);
  return match ? parseInt(match[1]) : 0;
}

function hasHeatPump(ev){
  const b = (ev.brand||"").toLowerCase().trim();
  const m = (ev.model||"").toLowerCase().trim();
  return ["tesla","byd","zeekr","xpeng","polestar","volvo"].includes(b) ||
    (b==="kia" && (m.includes("5")||m.includes("6")||m.includes("3")||m.includes("gt-line"))) ||
    (b==="hyundai" && (m.includes("ioniq")||m.includes("kona")||m.includes("inster")));
}

function buildCatalog(){
  const lines = RAW_CSV.split("\n").filter(l=>l.trim().length>0).slice(1);
  return lines.map(line=>{
    const cols = parseCSVLine(line);
    if (cols.length < 5) return null;
    const brand = cols[0]||"", model = cols[1]||"", trim = cols[2]||"";
    const id = (brand+"-"+model+"-"+trim).toLowerCase().replace(/[^a-z0-9]+/g,"-");
    const priceMSRP = parseInt(cols[3]) || 40000;
    const driveawayEst = parseInt(cols[4]) || 42000;
    const rangeWLTP = parseInt(cols[5]) || 350;
    const batteryCapacity = parseFloat(cols[6]) || 50;
    const chargeTime = batteryCapacity > 80 ? 32 : (batteryCapacity < 50 ? 25 : 30);
    const bodyType = mapBodyType(brand, model, cols[7]||"SUV");
    const efficiencyWhKm = parseInt(cols[8]) || 150;
    const drivetrain = cols[9] || "RWD";
    const seats = (model.toLowerCase().includes("ev9") || model.toLowerCase().includes("ex90")) ? 7 : 5;
    const isLCTExempt = priceMSRP < 89332;
    const isFBTExempt = isLCTExempt;

    let towingCapacity = "0kg (Not Certified)";
    const isAWD = drivetrain === "AWD";
    const isMediumSUV = bodyType === "Medium SUV";
    const isLargeSUV = bodyType === "Large SUV";
    if (isLargeSUV || (isAWD && bodyType.includes("SUV"))) towingCapacity = "1500kg";
    else if (isMediumSUV) towingCapacity = "1000kg";
    else if (bodyType === "Compact SUV") towingCapacity = "750kg";
    else if (brand==="Tesla" && model==="Model 3") towingCapacity = "1000kg";
    else if (brand==="BMW" && model==="i4") towingCapacity = "1600kg";
    else if (bodyType==="Sedan" && isAWD) towingCapacity = "1500kg";
    else if (bodyType==="Sedan" || bodyType==="Performance") towingCapacity = "750kg";

    const rangeScore = Math.min(10, Math.max(5, Math.round((rangeWLTP/65)*10)/10));
    const valueScore = Math.min(10, Math.max(5, Math.round((55000/priceMSRP)*8*10)/10));
    const comfortScore = bodyType.includes("Large") ? 9.0 : (bodyType.includes("Medium") ? 8.2 : 7.2);
    const chargingScore = chargeTime<=25 ? 9.2 : (chargeTime<=28 ? 8.5 : 7.5);
    const evScore = Math.round(((rangeScore+valueScore+comfortScore+chargingScore)/4)*10)/10;

    return { id, brand, model, trim, priceMSRP, driveawayEst, rangeWLTP, batteryCapacity,
      bodyType, fastChargeTimeMins: chargeTime, isLCTExempt, isFBTExempt, drivetrain,
      efficiencyWhKm, seats, towingCapacity, evScore };
  }).filter(Boolean);
}

const defaultAnswers = {
  budget:'mid', budgetType:'outright', layout:[], carRole:'primary', towNeed:'none',
  priorities:[], parking:'garage', trips:[], hasSolar:false,
  safetyWeight:3, rangeWeight:4, priceWeight:3, chargingWeight:3, spaceWeight:3,
  reputationWeight:3, esgWeight:3
};

// Ported directly from the full app's getWizardRecommendations()
function getWizardRecommendations(answers, catalog){
  const a = Object.assign({}, defaultAnswers, answers);
  return catalog.map(ev=>{
    let score = 100; const reasons = []; let dq = false;

    if (a.budget==='budget'){ if (ev.driveawayEst>45000) score-=150; else { score+=30; reasons.push("Fits within your entry-level budget (under $45k drive-away)"); } }
    else if (a.budget==='mid'){ if (ev.driveawayEst>70000) score-=150; else if (ev.driveawayEst<=45000){score+=20; reasons.push("Comfortably under your budget");} else {score+=30; reasons.push("A strong fit for your $45k–$70k budget");} }
    else if (a.budget==='premium'){ if (ev.driveawayEst>100000) score-=150; else if (ev.driveawayEst>70000){score+=30; reasons.push("Sits right in your $70k–$100k budget");} else {score+=15; reasons.push("Well under your premium budget ceiling");} }
    else if (a.budget==='unlimited'){ if (ev.driveawayEst>100000){score+=30; reasons.push("A flagship model matching your no-limit budget");} else {score+=15; reasons.push("Comfortably within your budget");} }

    if (a.budgetType==='sacrifice'){ if (ev.isFBTExempt){ score+=30; reasons.push("FBT exempt — cuts your novated lease payments significantly"); } }

    const towVal = getNumericTowingCapacity(ev.towingCapacity);
    if (a.towNeed==='light'){ if (towVal>=500){score+=20; reasons.push("Rated to tow a trailer or small boat ("+ev.towingCapacity+")");} else dq=true; }
    else if (a.towNeed==='heavy'){ if (towVal>=1500){score+=45; reasons.push("Heavy-tow rated for a caravan or boat ("+ev.towingCapacity+")");} else dq=true; }
    if (dq) return null;

    if (a.layout && a.layout.length>0){
      let match=false;
      a.layout.forEach(lay=>{
        if (lay==="Small Hatch" && ev.bodyType==="Hatchback") match=true;
        if (lay==="SUV" && ["Compact SUV","Medium SUV","Large SUV"].includes(ev.bodyType)) match=true;
        if (lay==="Family Wagon" && ["Sedan","Medium SUV","Large SUV"].includes(ev.bodyType)) match=true;
        if (lay==="Ute/Van" && ["Ute / Truck","Van","Large SUV"].includes(ev.bodyType)) match=true;
      });
      if (match){ score+=25; reasons.push("Matches the "+ev.bodyType.toLowerCase()+" shape you're after"); } else score-=150;
    }

    if (a.carRole==='primary'){
      if (ev.rangeWLTP>=450){ score+=20; reasons.push("High range ("+ev.rangeWLTP+"km) suits it as your main car"); }
      if (ev.fastChargeTimeMins<=28){ score+=15; reasons.push("Quick top-ups on long trips ("+ev.fastChargeTimeMins+" min fast-charge)"); }
    } else if (a.carRole==='second'){
      if (ev.driveawayEst<45000){ score+=20; reasons.push("Sized and priced right for a second/local car"); }
      else if (ev.batteryCapacity<=52) score+=10;
    }

    if (a.trips && a.trips.includes("alpine")){
      if (hasHeatPump(ev)){ score+=30; reasons.push("Has a heat pump — saves battery range in cold/snow conditions"); } else score-=20;
    } else if (a.trips && a.trips.includes("highway")){
      if (ev.rangeWLTP>=450){ score+=15; reasons.push("Strong range for regular highway driving"); }
    }

    if (a.parking!=='garage'){
      if (ev.fastChargeTimeMins<=26){ score+=20; reasons.push("Fast public charging (under 26 min) suits street/apartment parking"); }
    } else if (a.hasSolar){ score+=10; reasons.push("Great for daytime solar charging in your garage/driveway"); }

    if (a.priorities && a.priorities.length>0){
      a.priorities.forEach(pri=>{
        if (pri==='range' && ev.rangeWLTP>=490){ score+=20; reasons.push("Elite driving range ("+ev.rangeWLTP+"km WLTP)"); }
        if (pri==='charging' && ev.fastChargeTimeMins<=25){ score+=20; reasons.push("Class-leading fast-charge speed"); }
        if (pri==='safety' && ["Volvo","Zeekr","Tesla","BMW"].includes(ev.brand)){ score+=20; reasons.push("Strong safety reputation for this brand"); }
        if (pri==='performance' && (ev.drivetrain==="AWD" || ev.model.includes("Performance") || ev.model.includes("XPower"))){ score+=20; reasons.push("Quick, AWD-style performance"); }
        if (pri==='cargo' && (["Large SUV","Medium SUV"].includes(ev.bodyType) || ev.seats>=5)){ score+=20; reasons.push("Spacious cargo/passenger room"); }
        if (pri==='price' && ev.driveawayEst<=40000){ score+=20; reasons.push("One of the more affordable options on the market"); }
      });
    }

    const rangeW = a.rangeWeight ?? 4;
    if (ev.rangeWLTP>=480) score += (rangeW-3)*15; else if (ev.rangeWLTP<330) score -= (5-rangeW)*12;
    const priceW = a.priceWeight ?? 3;
    if (ev.driveawayEst<45000) score += (priceW-3)*18; else if (ev.driveawayEst>90000) score -= (priceW-3)*15;

    return { ev, score: Math.min(100, Math.max(10, score)), reasons: Array.from(new Set(reasons)).slice(0,3) };
  }).filter(x=>x!==null).sort((a,b)=>b.score-a.score);
}

/* ============================================================
   ROUTE SEARCH — decides WHERE stops go (runs once per direction)
   ============================================================ */
async function autoRouteLegs(startName, endName, vehicle, startSoC, settings){
  const start = findLocation(startName), end = findLocation(endName);
  if (!start) return { error: `Couldn't find "${startName}" in the location list.` };
  if (!end) return { error: `Couldn't find "${endName}" in the location list.` };
  if (start.name === end.name) return { error: "Start and destination are the same place." };

  const batteryCap = vehicle.batteryCapacity, whKm = vehicle.efficiencyWhKm;
  const maxRange = (batteryCap*1000)/whKm;
  const buffer = settings.safetyBuffer;

  let current = { lat:start.lat, lng:start.lng, name:start.name };
  let currentSoC = startSoC, dayDist = 0;
  const legs = [];
  const visited = new Set([start.name]);
  let iterations = 0;

  while (iterations++ < 40){
    const distToDestFromCurrent = calculateDrivingDistance(current, end);
    const usableRangeNow = Math.max(0, ((currentSoC - buffer)/100) * maxRange);
    if (distToDestFromCurrent <= 5) break;

    if (usableRangeNow >= distToDestFromCurrent && (dayDist + distToDestFromCurrent) <= settings.maxDailyKm + 80){
      legs.push({ id:newId(), kind:'destination', from:{name:current.name,lat:current.lat,lng:current.lng}, to:{name:end.name,lat:end.lat,lng:end.lng}, distanceKm: distToDestFromCurrent });
      break;
    }
    const dailyBudget = Math.max(0, settings.maxDailyKm - dayDist);
    const overnightTrigger = dailyBudget < usableRangeNow && dailyBudget < distToDestFromCurrent;
    const targetDist = overnightTrigger ? dailyBudget : Math.min(usableRangeNow, distToDestFromCurrent - 5);

    let best = null, bestScore = Infinity;
    for (const [tName, tLoc] of Object.entries(NATIONAL_LOCATIONS)){
      if (visited.has(tName)) continue;
      const distFromCurrent = calculateDrivingDistance(current, tLoc);
      const distTownToDest = calculateDrivingDistance(tLoc, end);
      const cap = Math.min(usableRangeNow, dailyBudget || usableRangeNow);
      if (distFromCurrent < 15 || distFromCurrent > cap) continue;
      const detour = (distFromCurrent + distTownToDest) - distToDestFromCurrent;
      if (detour > 70) continue;
      if (distTownToDest >= distToDestFromCurrent) continue;
      const score = Math.abs(distFromCurrent - targetDist) + detour*0.7;
      if (score < bestScore){ bestScore = score; best = { name:tName, lat:tLoc.lat, lng:tLoc.lng, distFromCurrent }; }
    }
    let nextStop;
    if (best){ nextStop = best; }
    else {
      const frac = Math.min(0.9, targetDist / Math.max(distToDestFromCurrent,1));
      nextStop = { name:"Unverified stop (no real charger confirmed nearby)", lat: current.lat+(end.lat-current.lat)*frac,
        lng: current.lng+(end.lng-current.lng)*frac, distFromCurrent: Math.round(targetDist) };
    }

    // Try to find a real charger near this candidate point. A real charger a
    // little further away is always better than an invented stop at a town
    // that doesn't actually have one (Rule 13) — but it must still be
    // reachable (Rule 1) and make forward progress, not backtrack (Rule 8).
    let chargerMeta = { isLive:false };
    const found = await findNearbyCharger(nextStop.lat, nextStop.lng);
    if (found){
      const realDist = calculateDrivingDistance(current, found);
      const realProgress = calculateDrivingDistance(found, end);
      const reachable = realDist <= usableRangeNow;
      const makesProgress = realProgress < distToDestFromCurrent;
      if (reachable && makesProgress){
        chargerMeta = { isLive:true, operator:found.operator, connectionType:found.connectionType, powerKw:found.powerKw, bays:found.bays, usageCost:found.usageCost, lastUpdated:found.lastUpdated };
        nextStop = { name: found.name, lat: found.lat, lng: found.lng, distFromCurrent: realDist };
      }
      // else: the nearest real charger we found is out of safe reach or backtracks —
      // keep the unverified placeholder rather than risk stranding the trip.
    }

    const socConsumed = (nextStop.distFromCurrent*whKm/1000)/batteryCap*100;
    currentSoC = Math.max(0, currentSoC - socConsumed);

    if (overnightTrigger){
      legs.push({ id:newId(), kind:'overnight', from:{name:current.name,lat:current.lat,lng:current.lng}, to:{name:nextStop.name,lat:nextStop.lat,lng:nextStop.lng},
        distanceKm: nextStop.distFromCurrent, chargerAtAccommodation:true, targetSoC:100, chargerMeta });
      currentSoC = 100; dayDist = 0;
    } else {
      legs.push({ id:newId(), kind:'charge', from:{name:current.name,lat:current.lat,lng:current.lng}, to:{name:nextStop.name,lat:nextStop.lat,lng:nextStop.lng},
        distanceKm: nextStop.distFromCurrent, targetSoC: settings.chargeCeiling, chargerMeta });
      currentSoC = Math.max(currentSoC, settings.chargeCeiling); dayDist += nextStop.distFromCurrent;
    }
    current = { lat: nextStop.lat, lng: nextStop.lng, name: nextStop.name };
    visited.add(nextStop.name);
  }
  return { legs };
}

/* ============================================================
   RECOMPUTE — walks the (possibly hand-edited) itinerary and
   fills in every day/date/SoC/cost/warning field from scratch.
   This is what re-runs after any manual edit.
   ============================================================ */
function recompute(itinerary, vehicle, settings, startSoC, startDate){
  const batteryCap = vehicle.batteryCapacity, whKm = vehicle.efficiencyWhKm;
  let currentSoC = startSoC, day = 1, date = startDate;

  itinerary.forEach(leg=>{
    leg.day = day; leg.date = date;

    if (leg.kind === 'stay'){
      leg.departSoC = Math.round(currentSoC);
      if (leg.chargerAtAccommodation !== false){
        const target = leg.targetSoC || 100;
        const energyAdded = Math.max(0, (target-currentSoC)/100*batteryCap);
        leg.energyAdded = energyAdded; leg.cost = energyAdded*settings.overnightRate;
        currentSoC = Math.max(currentSoC, target);
      } else { leg.energyAdded = 0; leg.cost = 0; }
      leg.arrivalSoC = Math.round(currentSoC);
      day += leg.nights; date = addDays(date, leg.nights);
      return;
    }

    const energyUsed = leg.distanceKm*whKm/1000;
    const socUsed = (energyUsed/batteryCap)*100;
    const arrivalSoC = currentSoC - socUsed;
    leg.departSoC = Math.round(currentSoC);
    leg.arrivalSoC = Math.round(Math.max(0, arrivalSoC));
    leg.warning = arrivalSoC < 5;
    currentSoC = Math.max(0, arrivalSoC);

    if (leg.kind === 'charge'){
      const target = leg.targetSoC || settings.chargeCeiling;
      const energyAdded = Math.max(0, (target-currentSoC)/100*batteryCap);
      leg.energyAdded = energyAdded; leg.cost = energyAdded*settings.publicDcRate;
      leg.timeMins = Math.round((energyAdded/100)*60) + 15;
      currentSoC = Math.max(currentSoC, target);
    } else if (leg.kind === 'overnight'){
      if (leg.chargerAtAccommodation !== false){
        const target = leg.targetSoC || 100;
        const energyAdded = Math.max(0, (target-currentSoC)/100*batteryCap);
        leg.energyAdded = energyAdded; leg.cost = energyAdded*settings.overnightRate;
        currentSoC = Math.max(currentSoC, target);
      } else { leg.energyAdded = 0; leg.cost = 0; }
      const nights = leg.nights || 1;
      day += nights; date = addDays(date, nights);
    } else if (leg.kind === 'sidetrip'){
      // position unchanged, no day change
    } else if (leg.kind === 'destination' || leg.kind === 'waypoint'){
      // arrival at a nominated stop or the final destination — no charging action
    }
  });
  return itinerary;
}

async function planSegmentChain(stopNames, waypointMeta, vehicle, firstStartSoC, settings){
  // stopNames: ordered list of location names, e.g. [from, wp1, wp2, ..., to]
  // waypointMeta: array aligned to the IN-BETWEEN stops only (length = stopNames.length - 2),
  // each { type:'stop'|'overnight', nights } — describes what happens at that intermediate stop.
  let itinerary = [];
  let segmentStartSoC = firstStartSoC;

  for (let i=0; i<stopNames.length-1; i++){
    const segOut = await autoRouteLegs(stopNames[i], stopNames[i+1], vehicle, segmentStartSoC, settings);
    if (segOut.error) return { error: segOut.error };
    let segLegs = segOut.legs;

    const isFinalSegment = (i === stopNames.length-2);
    if (!isFinalSegment && segLegs.length){
      // The last leg of a non-final segment arrives at a nominated waypoint —
      // relabel it according to what the user asked for there.
      const meta = waypointMeta[i] || { type:'stop' };
      const lastLeg = segLegs[segLegs.length-1];
      if (lastLeg.kind === 'destination'){
        if (meta.type === 'overnight'){
          lastLeg.kind = 'overnight';
          lastLeg.chargerAtAccommodation = true;
          lastLeg.targetSoC = 100;
          lastLeg.nights = meta.nights || 1;
          lastLeg.chargerMeta = undefined; // user-chosen stop, not an auto-search pick
        } else {
          lastLeg.kind = 'waypoint'; // pass-through preferred stop, no auto-charging
          lastLeg.chargerMeta = undefined;
        }
      }
      segmentStartSoC = (meta.type === 'overnight') ? 100 : 90; // best-guess for placing the NEXT segment's stops
    }
    itinerary = itinerary.concat(segLegs);
  }
  return { itinerary };
}

/* ---------- SIDE TRIPS — nominated before planning, anchored to a named
   point (start, a waypoint, or the destination), same concept as the full
   app's sideTrips array. Applied after the main route is built. */
function applySideTrips(itinerary, sideTrips){
  (sideTrips || []).forEach(st => {
    if (!st.location) return;
    let anchorIdx = -1;
    for (let i=itinerary.length-1; i>=0; i--){
      if (itinerary[i].to && itinerary[i].to.name && itinerary[i].to.name.toLowerCase() === st.fromPoint.toLowerCase()){ anchorIdx = i; break; }
    }
    // Special case: the anchor is the very start of the trip, which is never
    // a leg's arrival point (only ever a departure) — insert before leg 0 instead.
    const isStartAnchor = anchorIdx === -1 && itinerary.length && itinerary[0].from && itinerary[0].from.name.toLowerCase() === st.fromPoint.toLowerCase();
    if (anchorIdx === -1 && !isStartAnchor) return; // anchor not found (typo or point removed) — skip quietly
    const insertAt = isStartAnchor ? 0 : anchorIdx+1;
    const destLoc = findLocation(st.location); // may be null if it's not a gazetteer town — that's fine, just no map coords
    const destPoint = { name: st.location, lat: destLoc ? destLoc.lat : undefined, lng: destLoc ? destLoc.lng : undefined };

    if (st.purpose === 'overnight'){
      const out = { id:newId(), kind:'waypoint', from:{name:st.fromPoint}, to:destPoint, distanceKm: st.oneWayKm };
      const stay = { id:newId(), kind:'overnight', from:destPoint, to:destPoint, distanceKm:0,
        chargerAtAccommodation:true, targetSoC:100, nights: st.nights||1 };
      const back = { id:newId(), kind:'waypoint', from:destPoint, to:{name:st.fromPoint}, distanceKm: st.oneWayKm };
      itinerary.splice(insertAt, 0, out, stay, back);
    } else {
      const side = { id:newId(), kind:'sidetrip', from:{name:st.fromPoint}, to:{name:st.fromPoint},
        distanceKm: st.oneWayKm*2, note: `Side trip to ${st.location}` };
      itinerary.splice(insertAt, 0, side);
    }
  });
  return itinerary;
}

async function buildItinerary(form, vehicle, settings){
  const waypoints = form.waypoints || [];
  const outboundStops = [form.fromLoc, ...waypoints.map(w=>w.location), form.toLoc];
  const outboundMeta = waypoints.map(w=>({ type:w.type, nights:w.nights }));

  const outResult = await planSegmentChain(outboundStops, outboundMeta, vehicle, form.startSoC, settings);
  if (outResult.error) return { error: outResult.error };
  let itinerary = outResult.itinerary;

  if (form.roundTrip){
    const nights = form.nights || 0;
    let returnSearchStartSoC = 100;
    if (nights > 0){
      const dest = findLocation(form.toLoc);
      itinerary.push({ id:newId(), kind:'stay', from:{name:dest.name}, to:{name:dest.name},
        distanceKm:0, nights, chargerAtAccommodation:true, targetSoC:100 });
    } else {
      // Day trip — no overnight, so don't assume a full recharge at the
      // destination. Estimate the real arrival battery level by recomputing
      // the outbound leg alone, so the return search starts from a realistic
      // point instead of pretending you slept and woke up at 100%.
      const tempItinerary = itinerary.map(l=>({...l}));
      recompute(tempItinerary, vehicle, settings, form.startSoC, form.startDate);
      const lastLeg = tempItinerary[tempItinerary.length-1];
      returnSearchStartSoC = lastLeg ? lastLeg.arrivalSoC : form.startSoC;
    }
    const ret = await autoRouteLegs(form.toLoc, form.fromLoc, vehicle, returnSearchStartSoC, settings);
    if (ret.error) return { error: ret.error };
    itinerary = itinerary.concat(ret.legs);
  }
  itinerary = applySideTrips(itinerary, form.sideTrips);
  recompute(itinerary, vehicle, settings, form.startSoC, form.startDate);
  return { itinerary };
}

/* ---------- Edit operations ---------- */
function insertStop(itinerary, legId, kind, distanceIntoLeg, targetSoC, note, chargerInfo){
  const idx = itinerary.findIndex(l=>l.id===legId);
  if (idx===-1) return itinerary;
  const orig = itinerary[idx];
  if (kind === 'sidetrip'){
    const sideLeg = { id:newId(), kind:'sidetrip', from:{name:orig.to.name}, to:{name:orig.to.name},
      distanceKm: distanceIntoLeg*2, note: note||'Side trip' };
    itinerary.splice(idx+1, 0, sideLeg);
    return itinerary;
  }
  const splitName = chargerInfo ? chargerInfo.name : (note && note.trim() ? note.trim() : `Stop near ${orig.from.name}`);
  const splitCoords = chargerInfo ? { lat:chargerInfo.lat, lng:chargerInfo.lng } : {};
  const chargerMeta = chargerInfo ? { isLive:true, operator:chargerInfo.operator, connectionType:chargerInfo.connectionType, powerKw:chargerInfo.powerKw, bays:chargerInfo.bays, usageCost:chargerInfo.usageCost, lastUpdated:chargerInfo.lastUpdated } : undefined;
  const first = { id:newId(), kind: kind, from: orig.from, to: { name: splitName, ...splitCoords },
    distanceKm: distanceIntoLeg, targetSoC: targetSoC, chargerAtAccommodation: kind==='overnight' ? true : undefined,
    chargerMeta };
  const second = { ...orig, id:newId(), from: { name: splitName, ...splitCoords }, distanceKm: Math.max(1, orig.distanceKm - distanceIntoLeg) };
  itinerary.splice(idx, 1, first, second);
  return itinerary;
}
function removeStop(itinerary, legId){
  const idx = itinerary.findIndex(l=>l.id===legId);
  if (idx===-1) return itinerary;
  const leg = itinerary[idx];
  if (leg.kind === 'sidetrip' || leg.kind === 'stay'){
    itinerary.splice(idx,1);
    return itinerary;
  }
  let nextIdx = idx+1;
  while (nextIdx < itinerary.length && itinerary[nextIdx].kind === 'sidetrip') nextIdx++;
  if (nextIdx >= itinerary.length){ itinerary.splice(idx,1); return itinerary; }
  const next = itinerary[nextIdx];
  const merged = { ...next, id:newId(), from: leg.from, distanceKm: leg.distanceKm + next.distanceKm };
  for (let i=idx+1; i<nextIdx; i++){
    itinerary[i].from = { name: leg.from.name };
    itinerary[i].to = { name: leg.from.name };
  }
  itinerary.splice(nextIdx, 1, merged);
  itinerary.splice(idx, 1);
  return itinerary;
}

  });

function drawSchematicMap(el, points){
  el.classList.add('schematic');
  const W = 340, H = 260, PAD = 30;
  const lats = points.map(p=>p.lat), lngs = points.map(p=>p.lng);
  const minLat=Math.min(...lats), maxLat=Math.max(...lats), minLng=Math.min(...lngs), maxLng=Math.max(...lngs);
  const latRange = Math.max(maxLat-minLat, 0.3), lngRange = Math.max(maxLng-minLng, 0.3);
  function project(p){
    const x = PAD + ((p.lng-minLng)/lngRange) * (W-2*PAD);
    const y = PAD + (1-(p.lat-minLat)/latRange) * (H-2*PAD);
    return [x,y];
  }
  const coords = points.map(project);
  const pathD = coords.map((c,i)=> (i===0?'M':'L')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');
  const dots = points.map((p,i)=>{
    const [x,y] = coords[i];
    const isEndpoint = i===0 || i===points.length-1;
    const r = isEndpoint ? 6 : 4.5;
    const fill = isEndpoint ? '#E0A93B' : '#2F5D45';
    const labelY = y > H/2 ? y+16 : y-10;
    return `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="#fff" stroke-width="2"/>
      <text x="${x}" y="${labelY}" font-size="9" text-anchor="middle" fill="#4B5A47" font-family="Segoe UI, sans-serif">${escapeXml(p.name.length>16?p.name.slice(0,15)+'…':p.name)}</text>`;
  }).join('');
  el.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%;">
      <path d="${pathD}" fill="none" stroke="#2F5D45" stroke-width="2.5" opacity="0.75"/>
      ${dots}
    </svg>
    <div style="text-align:center;font-size:11px;color:var(--ink-soft);margin-top:4px;">Schematic route diagram. Use "Open in Google Maps" below for real navigation.</div>
  `;
}
function escapeXml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c])); }
function vehicleOptionsHTML(){ return CATALOG.map(ev=>`<option value="${ev.brand} ${ev.model} ${ev.trim}" data-id="${ev.id}">`).join(''); }

function sortWaypointsByRoute(form){
  const start = findLocation(form.fromLoc);
  if (!start) return;
  form.waypoints.sort((a,b)=>{
    const da = calculateDrivingDistance(start, findLocation(a.location) || start);
    const db = calculateDrivingDistance(start, findLocation(b.location) || start);
    return da - db;
  });
}

function wireSideTripForm(){
  const purposeSelect = document.getElementById('stPurpose');
  const nightsRow = document.getElementById('stNightsRow');
  const fromInput = document.getElementById('stFromPoint');
  const toInput = document.getElementById('stLocation');
  const distInput = document.getElementById('stOneWayKm');
  const distHint = document.getElementById('stDistHint');
  let distManuallyEdited = false;

  function tryAutoCalc(){
    const fromLoc = findLocation(fromInput.value.trim());
    const toLoc = findLocation(toInput.value.trim());
    if (fromLoc && toLoc && !distManuallyEdited){
      const d = calculateDrivingDistance(fromLoc, toLoc);
      distInput.value = d;
      distHint.textContent = `Calculated from the gazetteer: ${fromLoc.name} to ${toLoc.name} is ${d}km one-way.`;
    } else if (fromLoc && toInput.value.trim() && !toLoc){
      distHint.textContent = `"${toInput.value.trim()}" isn't in our list of towns — enter the one-way distance yourself.`;
    }
  }
  fromInput.addEventListener('input', tryAutoCalc);
  toInput.addEventListener('input', tryAutoCalc);
  distInput.addEventListener('input', ()=>{ distManuallyEdited = true; });

  purposeSelect.addEventListener('change', ()=>{ nightsRow.style.display = purposeSelect.value==='overnight' ? 'block' : 'none'; });
  document.getElementById('stCancelBtn').addEventListener('click', ()=>{ App.sideTripFormOpen=false; renderForm(); });
  document.getElementById('stSaveBtn').addEventListener('click', ()=>{
    const location = document.getElementById('stLocation').value.trim();
    if (!location){ alert("Please enter where the side trip goes."); return; }
    const fromPointRaw = document.getElementById('stFromPoint').value.trim();
    if (!fromPointRaw){ alert("Please enter where along your route this branches off."); return; }
    const resolved = findLocation(fromPointRaw);
    if (!resolved){ alert(`Couldn't find "${fromPointRaw}" — try a well-known nearby town.`); return; }
    const fromPoint = resolved.name;

    const existingPoints = [App.form.fromLoc, App.form.toLoc, ...App.form.waypoints.map(w=>w.location)].map(p=>p.toLowerCase());
    if (!existingPoints.includes(fromPoint.toLowerCase())){
      App.form.waypoints.push({ id:newId(), location: fromPoint, type:'stop', nights:1 });
      sortWaypointsByRoute(App.form);
    }

    const oneWayKm = parseFloat(document.getElementById('stOneWayKm').value) || 20;
    const purpose = purposeSelect.value;
    const nights = parseInt(document.getElementById('stNights').value) || 1;
    App.form.sideTrips.push({ id:newId(), fromPoint, location, oneWayKm, purpose, nights });
    App.sideTripFormOpen = false;
    renderForm();
  });
}

async function handlePlan(){
  const vehicle = CATALOG.find(ev=>ev.id===App.form.vehicleId) || findVehicleByLabel(App.form.vehicleLabel);
  if (!App.form.fromLoc || !App.form.toLoc){ alert("Please enter a starting point and a destination."); return; }
  if (!vehicle){ alert("Please choose a car from the list (start typing a brand or model)."); return; }

  App.viewingDay = null;
  App.screen = 'loading';
  render();

  const result = await buildItinerary(App.form, vehicle, App.settings);
  if (result.error){ App.itinerary = null; App.tripError = result.error; App.screen = 'results'; render(); return; }

  App.vehicle = vehicle;
  App.itinerary = result.itinerary;
  App.tripError = null;
  saveLastTrip({ from:App.form.fromLoc, to:App.form.toLoc, vehicleLabel:`${vehicle.brand} ${vehicle.model}`, itinerary: App.itinerary });
  App.screen = 'results';
  render();
  window.scrollTo(0,0);
}

/* ---------- SETTINGS ---------- */

    <div class="card">
      <div class="settings-field">
        <label>Public fast-charge rate ($/kWh)</label>
        <input type="number" step="0.01" id="s_publicDcRate" value="${s.publicDcRate}">
      </div>
      <div class="settings-field">

        <input type="number" step="0.01" id="s_overnightRate" value="${s.overnightRate}">
      </div>
      <div class="settings-field">
        <label>Fast-charge top-up target (%)</label>
        <input type="number" id="s_chargeCeiling" value="${s.chargeCeiling}">

      </div>

        <label>Max comfortable driving per day (km)</label>
        <input type="number" id="s_maxDailyKm" value="${s.maxDailyKm}">

      </div>
      <div class="settings-field">
        <label>Petrol price ($/L) — for comparison</label>
        <input type="number" step="0.01" id="s_petrolPrice" value="${s.petrolPrice}">
      </div>
      <div class="settings-field">
        <label>Average petrol economy (L/100km) — for comparison</label>
        <input type="number" step="0.1" id="s_petrolEconomy" value="${s.petrolEconomy}">
      </div>
      <button class="btn btn-primary" id="saveSettingsBtn">Save settings</button>
      <button class="restart" id="resetSettingsBtn">Reset to defaults</button>
    </div>
    <div class="footnote">This is a standalone app, separate from the main EV Hub, so it keeps its own settings here rather than sharing account-wide preferences. There's no licensing or account system — it's a personal offline tool, not a service with tiers.</div>
    <button class="restart" id="backBtn">Back</button>
  `;
  document.getElementById('saveSettingsBtn').addEventListener('click', ()=>{
    App.settings = {
      publicDcRate: parseFloat(document.getElementById('s_publicDcRate').value)||SETTINGS_DEFAULTS.publicDcRate,

      chargeCeiling: parseInt(document.getElementById('s_chargeCeiling').value)||SETTINGS_DEFAULTS.chargeCeiling,
      maxDailyKm: parseInt(document.getElementById('s_maxDailyKm').value)||SETTINGS_DEFAULTS.maxDailyKm,
      safetyBuffer: parseInt(document.getElementById('s_safetyBuffer').value)||SETTINGS_DEFAULTS.safetyBuffer,
      petrolPrice: parseFloat(document.getElementById('s_petrolPrice').value)||SETTINGS_DEFAULTS.petrolPrice,

    saveSettings(App.settings);

  });
  document.getElementById('resetSettingsBtn').addEventListener('click', ()=>{

/* ---------- RESULTS / EDITABLE ITINERARY ---------- */
function doRecompute(){ recompute(App.itinerary, App.vehicle, App.settings, App.form.startSoC, App.form.startDate); }

function verifiedStatusHTML(sum){
  if (!sum.autoStopCount) return '';
  if (sum.verifiedCount === sum.autoStopCount){
    return '<div class="footnote" style="text-align:left;margin-bottom:18px;">✅ All ' + sum.autoStopCount + ' automatic stops were confirmed against real chargers.</div>';
  }
  return '<div class="footnote" style="text-align:left;margin-bottom:18px;">⚠️ Only ' + sum.verifiedCount + ' of ' + sum.autoStopCount + ' automatic stops were confirmed against real chargers — the rest are unverified placeholders. If this device can\'t reach external sites, try opening this file from a real web address (e.g. hosted on GitHub Pages) instead of double-clicking it from disk.</div>';
}

function summarize(){
  const legs = App.itinerary.filter(l=>l.kind!=='stay');
  const totalDistance = legs.reduce((s,l)=> s + (l.kind==='sidetrip' ? 0 : l.distanceKm), 0);
  const chargeStops = App.itinerary.filter(l=>l.kind==='charge');
  const overnightStops = App.itinerary.filter(l=>l.kind==='overnight' || l.kind==='stay');
  const totalCost = App.itinerary.reduce((s,l)=> s + (l.cost||0), 0);
  const totalChargeMins = chargeStops.reduce((s,l)=> s + (l.timeMins||0), 0);
  const totalDays = App.itinerary.length ? App.itinerary[App.itinerary.length-1].day : 1;
  const petrolCost = (totalDistance/100) * App.settings.petrolEconomy * App.settings.petrolPrice;
  const autoStops = App.itinerary.filter(l=> (l.kind==='charge'||l.kind==='overnight') && l.chargerMeta !== undefined);
  const verifiedCount = autoStops.filter(l=>l.chargerMeta.isLive).length;
  return { totalDistance, chargeStopCount: chargeStops.length, overnightStopCount: overnightStops.length, totalCost, totalChargeMins, totalDays, petrolCost,
    verifiedCount, autoStopCount: autoStops.length };
}

function chargerBadge(l){
  if (l.kind!=='charge' && l.kind!=='overnight') return '';
  if (l.chargerMeta === undefined) return ''; // manually inserted stop — user chose this one, no lookup needed
  const meta = l.chargerMeta;
  if (meta && meta.isLive){
    const power = meta.powerKw ? `${meta.powerKw}kW ` : '';
    const bays = meta.bays ? `${meta.bays} bay${meta.bays>1?'s':''}` : null;
    const cost = meta.usageCost ? meta.usageCost : null;
    const extras = [bays, cost].filter(Boolean).join(' · ');
    return `<span class="live-badge live">📡 Real charger: ${meta.operator}</span>
      <div class="q-help" style="margin:4px 0 0;">${power}${meta.connectionType || ''}${extras ? ' · '+extras : ''} — from OpenChargeMap${meta.lastUpdated ? ', last updated '+new Date(meta.lastUpdated).toLocaleDateString('en-AU') : ''}</div>`;
  }
  return `<span class="live-badge estimated">⚠️ Unverified</span><div class="q-help" style="margin:4px 0 0;">No real public charger was confirmed within 120km — this is a placeholder position, not a real place to charge. Search for a real charger below, or check availability before relying on this stop.</div>`;
}

function legNote(l){
  if (l.kind==='charge') return `${chargerBadge(l)}<div class="leg-charge-note">⚡ Charge here ~${l.timeMins} min (${l.energyAdded.toFixed(0)} kWh, ~${money(l.cost)}) up to <input type="number" class="small-number target-soc" data-id="${l.id}" value="${l.targetSoC}">%</div>`;
  if (l.kind==='overnight') return `
    ${chargerBadge(l)}
    <div class="toggle-row" style="margin:6px 0;">
      <span class="toggle-label">Charger at accommodation</span>
      <label class="switch"><input type="checkbox" class="accom-toggle" data-id="${l.id}" ${l.chargerAtAccommodation!==false?'checked':''}><span class="slider"></span></label>
    </div>
    ${l.chargerAtAccommodation!==false ? `<div class="leg-overnight-note">🌙 Charges overnight to <input type="number" class="small-number target-soc" data-id="${l.id}" value="${l.targetSoC||100}">% (~${money(l.cost)})</div>` : `<div class="leg-overnight-note">🌙 No charger here — battery stays at ${l.arrivalSoC}% overnight</div>`}`;
  if (l.kind==='sidetrip') return `<div class="leg-charge-note">↪️ ${l.note||'Side trip'} — ${l.distanceKm}km round trip</div>`;
  if (l.kind==='stay') return `
    <div class="toggle-row" style="margin:6px 0;">
      <span class="toggle-label">Charger at accommodation</span>
      <label class="switch"><input type="checkbox" class="accom-toggle" data-id="${l.id}" ${l.chargerAtAccommodation!==false?'checked':''}><span class="slider"></span></label>
    </div>
    ${l.chargerAtAccommodation!==false ? `<div class="leg-overnight-note">Charges to ${l.targetSoC||100}% during your stay (~${money(l.cost)})</div>` : `<div class="leg-overnight-note">No charger — leaves at ${l.arrivalSoC}%</div>`}`;
  if (l.kind==='waypoint') return `<div class="leg-charge-note">📍 Stop here — no charging planned unless you add one below.</div>`;
  return `<div class="leg-charge-note">🏁 Arrive</div>`;
}

function addStopFormHTML(leg){
  return `
    <div class="inline-form" data-after="${leg.id}">
      <div class="q-title" style="font-size:14px;">Add a stop</div>
      <label>Type</label>
      <select id="newStopKind">
        <option value="charge">Charging top-up</option>
        <option value="overnight">Overnight stay</option>
        <option value="sidetrip">Side trip (out and back)</option>
      </select>

      <div id="chargerSearchBlock">
        <label>Find a real charger (optional)</label>
        <div style="display:flex;gap:6px;">
          <input type="text" id="chargerSearchTown" list="locList" placeholder="Search near a town" value="${leg.to && leg.to.name ? leg.to.name : ''}" style="flex:1;">
          <button id="chargerSearchBtn" style="flex-shrink:0;background:var(--gum);color:#fff;border:none;border-radius:8px;padding:0 14px;font-size:13px;cursor:pointer;">🔍</button>
        </div>
        <div id="chargerSearchResults"></div>
      </div>

      <div id="stopDistLabel">
        <label>How far into this leg (km)?</label>
        <input type="number" id="newStopDist" value="50">
      </div>
      <div id="stopSocRow">
        <label>Charge up to (%)</label>
        <input type="number" id="newStopSoc" value="${App.settings.chargeCeiling}">
      </div>
      <label>Note (optional — place name, reason)</label>
      <input type="text" id="newStopNote" placeholder="e.g. Friend's place, coffee stop">
      <div class="form-actions">
        <button class="cancel-btn" id="cancelStopBtn">Cancel</button>
        <button class="save-btn" id="saveStopBtn">Add stop</button>
      </div>
    </div>
  `;
}

function legCardHTML(l){
  const routeLabel = l.kind==='stay' ? `Staying in ${l.from.name} — ${l.nights} night${l.nights>1?'s':''}`
    : l.kind==='sidetrip' ? `Side trip from ${l.from.name}`
    : `${l.from.name} → ${l.to.name}`;
  const warning = l.warning ? `<div class="warning-banner">⚠️ You may not make it to the next stop on this charge — consider adding a top-up before this leg.</div>` : '';
  const removable = l.kind!=='destination';
  return `
    <div class="leg-card">
      <div class="leg-route">${routeLabel}</div>
      ${l.kind!=='stay' ? `<div class="leg-dist">${l.distanceKm} km</div>` : ''}
      ${warning}
      <div class="leg-soc">
        <div>Depart<b>${l.departSoC}%</b></div>
        <div>Arrive<b>${l.arrivalSoC}%</b></div>
      </div>
      ${legNote(l)}
      ${(l.kind!=='stay' && l.kind!=='sidetrip') ? `<a class="gmaps-link" href="${gmapsLegUrl(l.from,l.to)}" target="_blank" rel="noopener">Open this leg in Google Maps</a><br>` : ''}
      ${removable ? `<button class="remove-link" data-remove="${l.id}">Remove this stop</button>` : ''}
    </div>
    ${l.kind!=='destination' && l.kind!=='stay' ? `
      <div class="add-stop-row">
        <button data-addafter="${l.id}">+ Add a stop after this</button>
      </div>
      <div id="formSlot-${l.id}"></div>
    ` : ''}
  `;
}

function dayGroups(){
  const groups = {};
  App.itinerary.forEach(l=>{ (groups[l.day] = groups[l.day]||[]).push(l); });
  return groups;
}

function saveTripFormHTML(){
  return `
    <div class="inline-form">
      <label>Name this trip so you can find it again later</label>
      <input type="text" id="tripNameInput" value="${App.form.fromLoc} to ${App.form.toLoc}">
      <div id="saveTripMsg"></div>
      <div class="form-actions">
        <button class="cancel-btn" id="saveTripCancelBtn">Cancel</button>
        <button class="save-btn" id="saveTripConfirmBtn">Save</button>
      </div>
    </div>
  `;
}
function wireSaveTripForm(){
  document.getElementById('saveTripCancelBtn').addEventListener('click', ()=>{ App.showSaveForm=false; renderResults(); });
  document.getElementById('saveTripConfirmBtn').addEventListener('click', ()=>{
    const name = document.getElementById('tripNameInput').value.trim();
    const msg = document.getElementById('saveTripMsg');
    if (!name){ msg.innerHTML = `<div class="warning-banner">Please enter a name.</div>`; return; }
    const ok = saveTripAs(name, App.form);
    if (ok){
      msg.innerHTML = `<div class="leg-charge-note">✅ Saved as "${name}". Find it later under 📂 Saved Trips.</div>`;
      setTimeout(()=>{ App.showSaveForm=false; renderResults(); }, 1200);
    } else {
      msg.innerHTML = `<div class="warning-banner">Couldn't save — your browser's storage may be full, disabled, or blocked (this can happen in private/incognito mode). Try a different browser or normal browsing mode.</div>`;
    }
  });
}

function renderResults(){
  if (App.tripError){
    root.innerHTML = `
      <h2 style="font-size:20px;margin-bottom:14px;">Couldn't plan that trip</h2>
      <div class="warning-banner">${App.tripError}</div>
      <button class="restart" id="backBtn">Try again</button>
    `;
    document.getElementById('backBtn').addEventListener('click', ()=>{ App.screen='form'; render(); });
    return;
  }

  const sum = summarize();
  const groups = dayGroups();

  const dayCardsHTML = Object.keys(groups).map(dayNum=>{
    const legs = groups[dayNum];
    const first = legs[0];
    const stopNames = legs.filter(l=>l.kind!=='sidetrip').map(l=>l.to.name);
    const routeSummary = [first.from.name, ...stopNames].filter((n,i,arr)=>n!==arr[i-1]).join(' → ');
    const dayDist = legs.reduce((s,l)=> s + (l.kind==='sidetrip'||l.kind==='stay' ? 0 : l.distanceKm), 0);
    const chargeCount = legs.filter(l=>l.kind==='charge').length;
    const hasWarning = legs.some(l=>l.warning);
    return `
      <button class="menu-card" data-day="${dayNum}" style="width:100%;">
        <div class="mc-icon">📅</div>
        <div class="mc-body">
          <div class="mc-title">Day ${dayNum} <span class="date-badge">${formatDate(first.date)}</span>${hasWarning?' <span class="live-badge estimated" style="background:#FBEAEA;color:#7A2E2E;">⚠️ check this day</span>':''}</div>
          <div class="mc-desc">${routeSummary} · ${dayDist}km${chargeCount?` · ${chargeCount} charging stop${chargeCount>1?'s':''}`:''}</div>
        </div>
      </button>
    `;
  }).join('');

  root.innerHTML = `
    <div class="summary-card">
      <div class="summary-title">${App.form.fromLoc} ${App.form.roundTrip ? '⇄' : '→'} ${App.form.toLoc}</div>
      <div class="summary-grid">
        <div class="summary-stat">Distance<b>${sum.totalDistance} km</b></div>
        <div class="summary-stat">Days<b>${sum.totalDays}</b></div>
        <div class="summary-stat">Charging stops<b>${sum.chargeStopCount}</b></div>
        <div class="summary-stat">Overnights<b>${sum.overnightStopCount}</b></div>
        <div class="summary-stat">Charging cost<b>${money(sum.totalCost)}</b></div>
        <div class="summary-stat">Time charging<b>${sum.totalChargeMins} min</b></div>
      </div>
    </div>
    <div id="tripMap"></div>
    <a class="gmaps-link" href="${gmapsFullTripUrl(App.itinerary)}" target="_blank" rel="noopener">🧭 Open the whole trip in Google Maps</a>
    <div class="footnote" style="text-align:left;margin-top:14px;margin-bottom:6px;">Driving <b>${App.vehicle.brand} ${App.vehicle.model} ${App.vehicle.trim}</b>. The same trip in an average petrol car would burn roughly ${money(sum.petrolCost)} in fuel.</div>
    ${verifiedStatusHTML(sum)}
    <div class="section-label">Tap a day to see and edit its stops</div>
    ${dayCardsHTML}
    <div id="saveTripSlot">
      ${App.showSaveForm ? saveTripFormHTML() : `<button class="restart" id="saveTripBtn">💾 Save this trip</button>`}
    </div>
    <button class="restart" id="againBtn">Plan another trip</button>
    <div class="footnote">Road distances are approximated from a 484-town gazetteer, not live traffic or routing data. Charging stops marked "Live" come from OpenChargeMap; "Estimated" stops are the best-positioned town when no real charger was found nearby.</div>
  `;

  document.getElementById('againBtn').addEventListener('click', ()=>{ App.screen='form'; render(); });
  const saveTripBtn = document.getElementById('saveTripBtn');
  if (saveTripBtn) saveTripBtn.addEventListener('click', ()=>{ App.showSaveForm = true; renderResults(); });
  if (App.showSaveForm) wireSaveTripForm();
  root.querySelectorAll('[data-day]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ App.viewingDay = parseInt(btn.dataset.day); render(); window.scrollTo(0,0); });
  });
  drawTripMap(App.itinerary);
}

function renderDayDetail(){
  const groups = dayGroups();
  const legs = groups[App.viewingDay] || [];
  root.innerHTML = `
    <button class="restart" id="backToOverview" style="margin-bottom:14px;">← Back to trip overview</button>
    <div class="day-label">Day ${App.viewingDay} <span class="date-badge">${legs[0] ? formatDate(legs[0].date) : ''}</span></div>
    ${legs.map(legCardHTML).join('')}
    <button class="restart" id="backToOverview2" style="margin-top:10px;">← Back to trip overview</button>
  `;
  document.getElementById('backToOverview').addEventListener('click', ()=>{ App.viewingDay = null; render(); window.scrollTo(0,0); });
  document.getElementById('backToOverview2').addEventListener('click', ()=>{ App.viewingDay = null; render(); window.scrollTo(0,0); });

  root.querySelectorAll('.target-soc').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const leg = App.itinerary.find(l=>l.id===e.target.dataset.id);
      leg.targetSoC = parseInt(e.target.value)||leg.targetSoC;
      doRecompute(); renderDayDetail();
    });
  });
  root.querySelectorAll('.accom-toggle').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const leg = App.itinerary.find(l=>l.id===e.target.dataset.id);
      leg.chargerAtAccommodation = e.target.checked;
      doRecompute(); renderDayDetail();
    });
  });
  root.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      removeStop(App.itinerary, btn.dataset.remove);
      doRecompute();
      // the day this stop belonged to may have shifted or merged — return to overview to avoid confusion
      App.viewingDay = null;
      render();
    });
  });
  root.querySelectorAll('[data-addafter]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      App.addStopOpenFor = (App.addStopOpenFor === btn.dataset.addafter) ? null : btn.dataset.addafter;
      renderDayDetail();
      if (App.addStopOpenFor){
        const slot = document.getElementById('formSlot-'+App.addStopOpenFor);
        if (slot){
          const legObj = App.itinerary.find(l=>l.id===App.addStopOpenFor);
          slot.innerHTML = addStopFormHTML(legObj);
          wireAddStopForm(App.addStopOpenFor, renderDayDetail);
        }
      }
    });
  });
}

function wireAddStopForm(legId, rerender){
  rerender = rerender || renderResults;
  const leg = App.itinerary.find(l=>l.id===legId);
  let selectedCharger = null;

  const kindSelect = document.getElementById('newStopKind');
  const distLabel = document.getElementById('stopDistLabel');
  const socRow = document.getElementById('stopSocRow');
  const chargerBlock = document.getElementById('chargerSearchBlock');
  function syncFields(){
    const kind = kindSelect.value;
    distLabel.querySelector('label').textContent = kind==='sidetrip' ? 'How far away, one-way (km)?' : 'How far into this leg (km)?';
    socRow.style.display = kind==='sidetrip' ? 'none' : 'block';
    chargerBlock.style.display = kind==='sidetrip' ? 'none' : 'block';
  }
  kindSelect.addEventListener('change', syncFields);
  syncFields();

  document.getElementById('chargerSearchBtn').addEventListener('click', async ()=>{
    const town = document.getElementById('chargerSearchTown').value.trim();
    const resultsEl = document.getElementById('chargerSearchResults');
    if (!town){ resultsEl.innerHTML = `<div class="q-help">Enter a town to search near.</div>`; return; }
    resultsEl.innerHTML = `<div class="q-help">Searching OpenChargeMap…</div>`;
    const outcome = await searchChargersNear(town, 30);
    if (outcome.error){ resultsEl.innerHTML = `<div class="warning-banner">${outcome.error}</div>`; return; }
    if (!outcome.results.length){ resultsEl.innerHTML = `<div class="q-help">No chargers found within 30km of ${town}. You can still add an estimated stop below.</div>`; return; }
    resultsEl.innerHTML = outcome.results.map((c,i)=>`
      <button type="button" class="opt" data-cidx="${i}" style="text-align:left;width:100%;margin-bottom:6px;">
        <b>${c.name}</b><span class="opt-sub">${c.operator} · ${c.powerKw?c.powerKw+'kW ':''}${c.connectionType}${c.bays?' · '+c.bays+' bay'+(c.bays>1?'s':''):''}${c.usageCost?' · '+c.usageCost:''} · ${c.distanceFromAnchor}km from ${town}</span>
      </button>
    `).join('');
    resultsEl.querySelectorAll('[data-cidx]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        selectedCharger = outcome.results[parseInt(btn.dataset.cidx)];
        resultsEl.querySelectorAll('[data-cidx]').forEach(b=>b.classList.remove('selected'));
        btn.classList.add('selected');
        // If we know the leg's starting point, work out the real distance for them.
        if (leg && leg.from && leg.from.lat && leg.from.lng){
          const d = calculateDrivingDistance(leg.from, selectedCharger);
          document.getElementById('newStopDist').value = d;
        }
      });
    });
  });

  document.getElementById('cancelStopBtn').addEventListener('click', ()=>{ App.addStopOpenFor=null; rerender(); });
  document.getElementById('saveStopBtn').addEventListener('click', ()=>{
    const kind = kindSelect.value;
    const dist = parseFloat(document.getElementById('newStopDist').value) || 20;
    const soc = parseInt(document.getElementById('newStopSoc').value) || App.settings.chargeCeiling;
    const note = document.getElementById('newStopNote').value;
    insertStop(App.itinerary, legId, kind, dist, soc, note, kind!=='sidetrip' ? selectedCharger : null);
    doRecompute();
    App.addStopOpenFor = null;
    rerender();
  });
}

document.getElementById('buildTagBar').textContent = BUILD_TAG;
render();
</script>
